<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>遗响</title>
<link rel="icon" href="data:,">
<link rel="preload" as="image" href="assets/cover.webp" type="image/webp">
<link rel="stylesheet" href="style.css?v=github-pages-1">
</head>
<body>
<header class="topbar">
  <div class="brand">遗响</div>
  <nav class="tools">
    <button id="languageBtn" type="button" aria-label="Switch to English" data-tooltip="Switch to English">EN</button>
    <button id="logBtn" type="button" aria-label="剧情回看" data-tooltip="剧情回看">☰<span>回看</span></button>
    <button id="chapterBtn" type="button" aria-label="章节选择" data-tooltip="章节选择">✦<span>章节</span></button>
    <button id="notebookBtn" type="button" aria-label="线索笔记" data-tooltip="线索笔记">▤<span>笔记</span></button>
    <button id="hintBtn" type="button" aria-label="提示" data-tooltip="提示">💡<span>提示</span><i id="hintDot" class="hint-dot" hidden></i></button>
    <button id="memoryBtn" type="button" aria-label="角色记忆" data-tooltip="角色记忆">◈<span>记忆</span></button>
    <button id="helpBtn" type="button" aria-label="帮助" data-tooltip="帮助">?<span>帮助</span></button>
  </nav>
</header>
<main id="stage">
  <div id="bg" class="background"></div>
  <div class="vignette"></div>

  <section id="cover" class="cover" style="background-image:url('assets/cover.webp');background-size:cover;background-position:center;">
    <div class="cover-copy">
      <p class="eyebrow"><i></i>AN INTERACTIVE STORY</p>
      <h1>遗响</h1>
      <p class="cover-line">每一次死亡，都是一次重来。<br>这一次，你能找到真相吗？</p>
      <div class="cover-actions">
        <button id="startBtn" class="primary" type="button">开始故事 <span>→</span></button>
        <button id="continueBtn" class="continue" type="button" hidden>继续上一次 <span>↺</span></button>
      </div>
      <p class="cover-note">点击 / 空格推进 · 进度自动保存在本机<br><span>A TIME-LOOP INTERACTIVE VISUAL NOVEL</span></p>
    </div>
  </section>

  <section id="play" hidden>
    <div class="chapter-label"><span id="chIndex"></span><h2 id="chTitle"></h2><p id="chLoc"></p></div>
    <div id="loopCount"></div>
    <div id="objective" class="objective" hidden><small>此刻</small><span id="objText"></span></div>

    <div id="hotspots"></div>

    <div id="taskHint" class="task-hint"></div>

    <div class="inventory">
      <small>物品</small>
      <div id="items"></div>
      <span class="inventory-note" hidden></span>
    </div>

    <div id="dialogue" class="dialogue">
      <div class="dialogue-head"><span id="speaker"></span><small id="moment"></small></div>
      <p id="lineText" class="line-text"></p>
      <div id="choices" class="choices"></div>
      <button id="nextBtn" class="next" type="button">点击继续 <span>↓</span></button>
    </div>
    <div id="ending" class="ending" hidden>
      <span id="endingTag" class="ending-tag"></span>
      <h2 id="endingTitle"></h2>
      <p id="endingText"></p>
      <div class="panel-actions">
        <button id="replayBtn" class="small-btn" type="button">再玩一次</button>
        <button id="endingChapterBtn" class="small-btn" type="button">回到章节</button>
      </div>
    </div>
  </section>
</main>
<footer class="footer"><span>遗响 · interactive visual novel</span><span>空格 / Enter 推进 · Esc 关闭面板</span></footer>

<div id="modal" class="modal" hidden>
  <div class="modal-shade" data-close></div>
  <div class="modal-card">
    <button id="closeModal" class="close" type="button" aria-label="关闭">×</button>
    <div id="modalBody"></div>
  </div>
</div>
<div id="toast"></div>

<script src="locales.en.js"></script>
<script src="i18n.js?v=zh-default-20261019"></script>
<script src="story.js"></script>
<script src="memory.js"></script>
<script src="notebook.js"></script>
<script src="game.js"></script>
<div id="impactOverlay" class="impact-overlay"><div class="impact-crack"></div><div id="impactText" class="impact-text"></div></div>
<div id="deathOverlay" class="death-overlay">
  <div class="death-text">死亡</div>
  <div class="death-sub">时间回溯</div>
</div>
</body>
</html>
